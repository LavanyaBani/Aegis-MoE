<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-label="Offline synchronization scenario workflow">
<defs><style>.h{font:700 28px Arial;fill:#132846}.t{font:700 18px Arial;fill:#17304f}.s{font:15px Arial;fill:#3f5874}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#54718f"/></marker></defs>
<rect width="1400" height="430" rx="24" fill="#f6f9fd"/><text x="700" y="52" text-anchor="middle" class="h">Simulated Offline-to-Online Synchronization</text>
<g>
<rect x="45" y="120" width="235" height="160" rx="18" fill="#e1f2fb" stroke="#3186a8" stroke-width="2"/><text x="162" y="160" text-anchor="middle" class="t">1. Offline Events</text><text x="162" y="195" text-anchor="middle" class="s">Synthetic transactions</text><text x="162" y="220" text-anchor="middle" class="s">created while disconnected</text><text x="162" y="245" text-anchor="middle" class="s">with event timestamps</text>
<rect x="330" y="120" width="235" height="160" rx="18" fill="#fff0d9" stroke="#d18b24" stroke-width="2"/><text x="447" y="160" text-anchor="middle" class="t">2. Reconnect</text><text x="447" y="195" text-anchor="middle" class="s">Simulate delayed arrival</text><text x="447" y="220" text-anchor="middle" class="s">and batch synchronization</text><text x="447" y="245" text-anchor="middle" class="s">scenario metadata</text>
<rect x="615" y="120" width="235" height="160" rx="18" fill="#e9e7ff" stroke="#7665c9" stroke-width="2"/><text x="732" y="160" text-anchor="middle" class="t">3. Aegis-MoE</text><text x="732" y="195" text-anchor="middle" class="s">Build tabular, graph,</text><text x="732" y="220" text-anchor="middle" class="s">and temporal features</text><text x="732" y="245" text-anchor="middle" class="s">score expert outputs</text>
<rect x="900" y="120" width="205" height="160" rx="18" fill="#ffe6e6" stroke="#cb5a64" stroke-width="2"/><text x="1002" y="160" text-anchor="middle" class="t">4. Risk Engine</text><text x="1002" y="195" text-anchor="middle" class="s">Risk score</text><text x="1002" y="220" text-anchor="middle" class="s">Configurable bands</text><text x="1002" y="245" text-anchor="middle" class="s">Ranked alerts</text>
<rect x="1155" y="120" width="200" height="160" rx="18" fill="#dff6ef" stroke="#24967b" stroke-width="2"/><text x="1255" y="160" text-anchor="middle" class="t">5. Review</text><text x="1255" y="195" text-anchor="middle" class="s">Dashboard</text><text x="1255" y="220" text-anchor="middle" class="s">Supporting signals</text><text x="1255" y="245" text-anchor="middle" class="s">Human investigation</text>
</g>
<g stroke="#54718f" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M280 200H324"/><path d="M565 200H609"/><path d="M850 200H894"/><path d="M1105 200H1149"/></g>
<text x="700" y="340" text-anchor="middle" font-family="Arial" font-size="17" fill="#526982">The offline-sync events and attack scenarios are simulated for evaluation.</text>
<text x="700" y="372" text-anchor="middle" font-family="Arial" font-size="15" fill="#526982">Use real payment data only with appropriate authorization, governance, and privacy controls.</text>
</svg>